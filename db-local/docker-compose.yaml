services:
  mongo:
    image: mongo:8.0.20
    container_name: cats_db
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_cats:/data/db
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mongo_cats: {}
