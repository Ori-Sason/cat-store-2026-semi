# Git hooks. Fresh clone: `npm run hooks:install` (.npmrc ignore-scripts skips lefthook's postinstall).
output:
  - summary
  - failure

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,mjs}"
      run: npx oxfmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx,js,mjs}"
      run: npx oxlint --deny-warnings {staged_files}
    - name: typecheck
      run: npm run typecheck

# Backend tests and E2E hit the db-local Mongo container, so it must be up before pushing.
# Piped: one job at a time, stop on the first failure. Both suites wipe catsTest, so they
# must not overlap, and E2E is skipped when the unit tests already failed.
pre-push:
  piped: true
  jobs:
    - name: test
      run: npm test
    - name: e2e
      run: npm run test:e2e
